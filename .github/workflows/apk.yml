name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        run: npm install --legacy-peer-deps
      - name: Montar www
        run: |
          mkdir www
          cp index.html www/
          cp -r data www/data
          [ -d icons ] && cp -r icons www/icons || true
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' $M
          G=android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" $G
      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Assinar
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks signing/polski.jks --ks-pass pass:polskipowoli --key-pass pass:polskipowoli --ks-key-alias polski --out polski-powoli.apk aligned.apk
          $BT/apksigner verify polski-powoli.apk
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" polski-powoli.apk \
            --title "Polski, powoli 1.${{ github.run_number }}" \
            --notes "APK assinado. Instale ou atualize pelo Obtainium."
