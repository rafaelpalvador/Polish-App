<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polski, powoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: uma coluna de leitura, como um caderno quadriculado polonês (zeszyt w kratkę),
     com a letra-símbolo de cada capítulo em destaque. */
  --bg: #eceff2;
  --surface: #fafbfc;
  --ink: #181b23;
  --muted: #5d6371;
  --line: #d5dae2;
  --accent: #b3263e;      /* czerwień: vermelho da bandeira, um pouco mais fundo */
  --accent-soft: #f6e3e6;
  --amber: #b97a12;       /* bursztyn: âmbar do Báltico */
  --good: #2e7a57;
  --good-soft: #e1f1e8;
  --bad: #b3263e;
  --grid: rgba(64, 96, 160, .10);
  --display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d24; --ink: #eceef2; --muted: #9ba1ad; --line: #2c313b;
    --accent: #e25a70; --accent-soft: #3a1e25; --amber: #e3ab45; --good: #5cc08f; --good-soft: #17322a;
    --bad: #f07a8b; --grid: rgba(140, 170, 230, .08); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d24; --ink: #eceef2; --muted: #9ba1ad; --line: #2c313b;
  --accent: #e25a70; --accent-soft: #3a1e25; --amber: #e3ab45; --good: #5cc08f; --good-soft: #17322a;
  --bad: #f07a8b; --grid: rgba(140, 170, 230, .08); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
a { color: var(--accent); }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 20px 80px; }
h1, h2, h3 { text-wrap: balance; }
.serif { font-family: var(--display); font-weight: 400; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

/* Topo */
.ornament { font-family: var(--display); color: var(--accent); opacity: .55; letter-spacing: .6em; white-space: nowrap; overflow: hidden; font-size: 15px; padding: 10px 0 0; text-align: center; user-select: none; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 18px 0 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
.brand b i { color: var(--accent); }
.brand span { font-size: 13px; color: var(--muted); }
.levels { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.levels button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--muted); }
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.levels button:disabled { cursor: default; opacity: .55; }
.levels small { font-weight: 500; font-size: 10px; display: block; line-height: 1; letter-spacing: .04em; }

/* Hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 8px 28px; align-items: center; padding: 34px 0 26px; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6vw, 50px); line-height: 1.05; margin: 8px 0 10px; }
.hero h1 em { color: var(--accent); }
.hero p { margin: 0 0 18px; color: var(--muted); max-width: 46ch; }
.bigglyph { font-family: var(--display); font-size: clamp(120px, 26vw, 210px); line-height: .8; color: var(--accent); text-align: center; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
.bigglyph small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); line-height: 1.3; margin-top: 14px; }
.bigglyph small b { color: var(--ink); font-weight: 600; }
@keyframes rise { from { opacity: .0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .bigglyph { animation: none; } * { scroll-behavior: auto !important; } }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: 15px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 14px; font-size: 14px; }
.meter { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; margin-top: 12px; }
.meter .bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter span { font-size: 13px; color: var(--muted); }

/* Lista de capítulos */
.chapters { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
.chapters li { border-bottom: 1px solid var(--line); }
.chapters a { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 14px 4px; text-decoration: none; color: var(--ink); }
.chapters a:hover .ttl { color: var(--accent); }
.gl { font-family: var(--display); font-size: 46px; line-height: 1; text-align: center; color: var(--muted); }
.done .gl { color: var(--accent); }
.ttl { font-family: var(--display); font-size: 25px; line-height: 1.1; }
.sub { font-size: 14px; color: var(--muted); }
.ticks { display: flex; gap: 4px; }
.ticks i { width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid var(--line); }
.ticks i.on { background: var(--accent); border-color: var(--accent); }
.chnum { font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 30px; }
.section-h h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; }
.soon { margin-top: 26px; padding: 20px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); font-size: 15px; }

/* Capítulo */
.back { display: inline-block; margin: 20px 0 0; font-size: 14px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--accent); }
.chhead { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: center; padding: 18px 0 8px; }
.chhead .bigglyph { font-size: clamp(96px, 20vw, 150px); grid-row: span 2; }
.chhead h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6.5vw, 52px); line-height: 1; margin: 6px 0 4px; }
.chhead .pt { font-size: 18px; color: var(--muted); }
.sound { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: 14px; margin-top: 10px; }
.sound b { font-family: var(--display); font-size: 22px; font-weight: 400; }
.goals { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; padding: 0; list-style: none; }
.goals li { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
details.busuu { margin-top: 10px; font-size: 13px; color: var(--muted); }
details.busuu summary { cursor: pointer; }
details.busuu ol { margin: 6px 0 0; padding-left: 20px; }

.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 2px; overflow-x: auto; margin: 22px -20px 0; padding: 10px 20px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: transparent; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.tabs button .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-grid; place-items: center; font-size: 11px; }
.tabs button.ok .n { background: var(--accent); border-color: var(--accent); color: #fff; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.panel { padding-top: 22px; }
.panel h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 26px 0 10px; }
.panel h3:first-child { margin-top: 0; }
.lead { color: var(--muted); margin: 0 0 16px; }
.bar-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; align-items: center; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.stepdone { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stepdone p { margin: 0; color: var(--muted); font-size: 14px; }
.okmark { color: var(--good); font-weight: 600; }

/* Vocabulário */
.vgroup { margin-bottom: 22px; }
.vgroup h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.vrow { display: grid; grid-template-columns: 1fr 1fr 34px; gap: 4px 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.vrow .pl { font-weight: 600; font-size: 17px; }
.vrow .tr { color: var(--ink); }
.vrow .note { grid-column: 2 / 3; font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.hide-tr .vrow .tr, .hide-tr .vrow .note { filter: blur(6px); transition: filter .15s; }
.hide-tr .vrow:hover .tr, .hide-tr .vrow:hover .note, .hide-tr .vrow:focus-within .tr { filter: none; }
.say { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; color: var(--muted); padding: 0; }
.say:hover { color: var(--accent); border-color: var(--accent); }
.say svg { width: 15px; height: 15px; }
.no-audio .say, .no-audio .say-label { display: none; }
@media (max-width: 520px) { .vrow { grid-template-columns: 1fr 34px; } .vrow .tr { grid-column: 1; grid-row: 2; font-size: 14.5px; color: var(--muted); } .vrow .say { grid-row: 1 / span 2; grid-column: 2; } .vrow .note { grid-column: 1; } }

/* Cartões */
.flash { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 22px; text-align: center; min-height: 230px; display: grid; place-items: center; gap: 10px; }
.flash .face { font-family: var(--display); font-size: clamp(30px, 7vw, 46px); line-height: 1.1; }
.flash .back-face { color: var(--muted); font-size: 18px; }
.flash .meta { font-size: 13px; color: var(--muted); }

/* Gramática */
.gram { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 20px 16px; margin-bottom: 16px; }
.gram h4 { font-family: var(--display); font-weight: 400; font-size: 23px; margin: 12px 0 6px; }
.gram p { margin: 8px 0; }
.gram .tblwrap { overflow-x: auto; }
.gram table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 8px 0; }
.gram th { text-align: left; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; border-bottom: 1.5px solid var(--ink); padding: 6px 10px 6px 0; }
.gram td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; vertical-align: top; }
.gram td b { color: var(--accent); }
.gram .tip { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14.5px; }
.gram .scale { font-family: var(--display); font-size: 20px; }
.gram .addr { font-family: var(--display); font-size: 22px; line-height: 1.2; border-left: 3px solid var(--accent); padding-left: 12px; }
.ask { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.ask textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); resize: vertical; }
.answer { white-space: pre-wrap; margin-top: 12px; font-size: 15px; }

/* Diálogo */
.dlg { display: flex; flex-direction: column; gap: 10px; }
.line { max-width: 86%; display: flex; gap: 8px; align-items: flex-start; }
.line .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 8px 14px; }
.line.r { align-self: flex-end; flex-direction: row-reverse; }
.line.r .bubble { border-radius: 14px 14px 4px 14px; background: var(--accent-soft); border-color: transparent; }
.line .who { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.line .plt { font-size: 17px; }
.line .ptt { font-size: 14px; color: var(--muted); }
.hide-pt .ptt { display: none; }
.line.speaking .bubble { box-shadow: 0 0 0 2px var(--accent); }

/* Prática */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.subtabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
.subtabs button[aria-selected="true"] { border-color: var(--ink); color: var(--ink); }
.subtabs .sc { font-weight: 500; color: var(--good); margin-left: 4px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
.q .prompt { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.q .term { font-family: var(--display); font-size: 28px; line-height: 1.15; margin-bottom: 12px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } }
.opts button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.opts button:hover:not(:disabled) { border-color: var(--ink); }
.opts button.right { border-color: var(--good); background: var(--good-soft); }
.opts button.wrong { border-color: var(--bad); background: var(--accent-soft); }
.opts button:disabled { cursor: default; }
.fillrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 17px; }
.fillrow input { width: 9.5em; border: 0; border-bottom: 2px solid var(--line); background: transparent; padding: 2px 4px; font-size: 17px; font-weight: 600; }
.fillrow input:focus { outline: none; border-color: var(--accent); }
.fillrow input.right { border-color: var(--good); color: var(--good); }
.fillrow input.close { border-color: var(--amber); color: var(--amber); }
.fillrow input.wrong { border-color: var(--bad); color: var(--bad); }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
.fb { font-size: 13.5px; margin-top: 6px; }
.fb.right { color: var(--good); } .fb.wrong { color: var(--bad); } .fb.close { color: var(--amber); }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 6px 0; }
.tokens.built { border-bottom: 2px solid var(--line); margin-bottom: 8px; }
.tokens button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 16px; }
.tokens.built button { background: var(--surface); border-color: var(--ink); }
.scorebox { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 16px; }
.scorebox b { font-family: var(--display); font-weight: 400; font-size: 44px; color: var(--amber); line-height: 1; }
.keys { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.keys button { min-width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--display); font-size: 20px; padding: 0 6px; }
.keys button:hover { border-color: var(--accent); color: var(--accent); }

/* Redação */
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
.task p { margin: 0 0 8px; font-size: 17px; }
.task ul { margin: 0; padding-left: 20px; }
.task li { margin: 3px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: 13.5px; }
.chips button:hover { border-color: var(--accent); }
.paper { width: 100%; min-height: 240px; border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; font-size: 18px; line-height: 30px; resize: vertical;
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 15px 15px; background-position: -1px 14px; }
.paper:focus { outline: none; border-color: var(--accent); }
.wc { font-size: 13px; color: var(--muted); }
.wc.ok { color: var(--good); }
.result { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.result .grade { display: flex; align-items: baseline; gap: 10px; }
.result .grade b { font-family: var(--display); font-weight: 400; font-size: 60px; line-height: 1; color: var(--amber); }
.result h4 { margin: 18px 0 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.corrected { font-size: 17px; line-height: 1.7; white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.err { border-top: 1px solid var(--line); padding: 10px 0; }
.err .pair { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.err s { color: var(--bad); text-decoration-thickness: 1.5px; }
.err ins { color: var(--good); text-decoration: none; font-weight: 600; }
.err .tag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.err p { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { padding: 4px 0; font-size: 15px; display: flex; gap: 8px; }
.checks li .m { flex: none; font-weight: 700; }
.checks li .m.y { color: var(--good); } .checks li .m.n { color: var(--bad); }
.model { padding: 6px 0; border-bottom: 1px solid var(--line); }
.model .plt { font-weight: 600; }
.model .ptt { font-size: 14px; color: var(--muted); }
.history { margin-top: 18px; font-size: 14px; color: var(--muted); }
.history button { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: 14px; }
.notice { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.toast.show { opacity: 1; }
.syncnote { font-size: 12px; color: var(--muted); text-align: right; margin-top: 30px; }
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; }
  .hero .bigglyph { order: -1; text-align: left; }
  .chapters a { grid-template-columns: 48px 1fr; }
  .chapters .ticks { grid-column: 2; }
  .gl { font-size: 38px; }
}

/* Navegação principal */
.mainnav { display: flex; gap: 2px; margin: 10px 0 0; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.mainnav a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.mainnav a[aria-current="page"] { color: var(--ink); border-color: var(--accent); }
.mainnav .spacer { flex: 1; }
.audiochip { align-self: center; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.audiochip i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); display: inline-block; }
.audiochip.on i { background: var(--good); }
.audiochip.off i { background: var(--amber); }
.audiohelp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin-top: 12px; font-size: 14.5px; }
.audiohelp h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 22px; }
.audiohelp ol { margin: 6px 0; padding-left: 20px; }
.rate { display: inline-flex; gap: 4px; align-items: center; }

<script>
/* Registro dos níveis. Para adicionar capítulos de um nível: crie data/a2-1.js etc. com COURSE.add('a2', {...})
   e inclua a tag <script> abaixo. Bancos de vocabulário: COURSE.bank(nível, grupos). Paradas: COURSE.stops(nível, lista). */
window.COURSE = {
  levels: {}, banks: {}, stopsBy: {}, extras: {},
  meta: [
    { id: 'a1', name: 'A1', title: 'Iniciante' },
    { id: 'a2', name: 'A2', title: 'Elementar' },
    { id: 'b1', name: 'B1', title: 'Intermediário' },
    { id: 'b2', name: 'B2', title: 'Intermediário superior' },
  ],
  add(level, ch) {
    /* Palavras podem trazer o exemplo junto: [pl, pt, nota, exemplo_pl, exemplo_pt]; checks podem vir no capítulo. */
    const ex = {};
    for (const g of ch.vocab || []) g.w = g.w.map(w => { if (w.length >= 5) { ex[w[0]] = [w[3], w[4]]; return [w[0], w[1], w[2] || '']; } return w; });
    if (Object.keys(ex).length || ch.checks) { const k = level + '-' + ch.n, o = this.extras[k] || {}; this.extras[k] = { ex: Object.assign(o.ex || {}, ex), checks: ch.checks || o.checks || [] }; }
    (this.levels[level] = this.levels[level] || []).push(ch); this.levels[level].sort((a, b) => a.n - b.n);
  },
  bank(level, groups, dedupe) {
    /* Com dedupe=true, descarta palavras que já existem nos capítulos ou nos bancos do nível. */
    if (dedupe) {
      const key = x => String(x).toLowerCase().split(' / ')[0].trim();
      const seen = new Set();
      for (const c of this.levels[level] || []) for (const g of c.vocab || []) for (const w of g.w) seen.add(key(w[0]));
      for (const g of this.banks[level] || []) for (const w of g.w) seen.add(key(w[0]));
      groups = groups.map(g => Object.assign({}, g, { w: g.w.filter(w => { const k = key(w[0]); if (seen.has(k)) return false; seen.add(k); return true; }) })).filter(g => g.w.length);
    }
    (this.banks[level] = this.banks[level] || []).push(...groups);
  },
  stops(level, list) { this.stopsBy[level] = list; },
  extra(level, n, obj) { this.extras[level + '-' + n] = obj; },
};
</script>

/* ---------- Progresso: db por pessoa, com cópia local ---------- */
const blank = () => ({ p: {}, last: null, known: {}, days: {}, stops: {}, grades: [], srs: {} });
const store = {
  db: null, uid: null, data: blank(), essays: {},
  key: 'polski-progress-v1',
  async init() {
    try { const raw = localStorage.getItem(this.key); if (raw) this.data = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
    try { const ess = localStorage.getItem(this.key + '-essays'); if (ess) this.essays = JSON.parse(ess); } catch (e) {}
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      this.db = db; this.uid = uid;
      const snap = await this.ref().get();
      if (snap.exists) this.data = mergeProgress(this.data, snap.data());
      setSync('Progresso salvo na sua conta.');
      render();
    } catch (e) { setSync('Progresso salvo só neste navegador.'); }
  },
  ref() { return this.db.doc('data/users/' + this.uid + '/progress'); },
  essayRef(id) { return this.ref().collection('essays').doc(id); },
  saving: Promise.resolve(), timer: null,
  save(now) {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
    if (!this.db) return;
    clearTimeout(this.timer);
    const run = () => { const body = JSON.parse(JSON.stringify(this.data)); this.saving = this.saving.then(() => this.ref().set(body)).catch(() => setSync('Não consegui salvar na conta agora; ficou salvo neste navegador.')); };
    if (now) run(); else this.timer = setTimeout(run, 1200);
  },
  get(id) { return this.data.p[id] || (this.data.p[id] = {}); },
  log(n = 1) { const d = today(); this.data.days[d] = (this.data.days[d] || 0) + n; },
  mark(id, step, val = true) { this.get(id)[step] = val; this.data.last = id; this.log(); this.save(); },
  box(key) { return this.data.known[key] || 0; },
  setBox(key, v) { if (v <= 0) delete this.data.known[key]; else { this.data.known[key] = Math.min(5, v); srsSeed(key); } this.log(); this.save(); },
  async loadEssay(id) {
    if (this.essays[id]) return this.essays[id];
    let e = { attempts: [], draft: '' };
    if (this.db) { try { const s = await this.essayRef(id).get(); if (s.exists) e = Object.assign(e, s.data()); } catch (err) {} }
    this.essays[id] = e; return e;
  },
  essayTimers: {}, essayQueue: {},
  saveEssay(id, now) {
    try { localStorage.setItem(this.key + '-essays', JSON.stringify(this.essays)); } catch (e) {}
    if (!this.db) return;
    clearTimeout(this.essayTimers[id]);
    const run = () => { const body = JSON.parse(JSON.stringify(this.essays[id])); this.essayQueue[id] = (this.essayQueue[id] || Promise.resolve()).then(() => this.essayRef(id).set(body)).catch(() => {}); };
    if (now) run(); else this.essayTimers[id] = setTimeout(run, 1500);
  },
};
function mergeProgress(a, b) {
  a = Object.assign(blank(), a); b = Object.assign(blank(), b);
  const out = blank(); out.last = b.last || a.last;
  for (const id of new Set([...Object.keys(a.p), ...Object.keys(b.p)])) {
    const x = a.p[id] || {}, y = b.p[id] || {}, m = Object.assign({}, x, y);
    for (const k of ['pratica', 'redacao']) {
      if (x[k] === undefined || y[k] === undefined) continue;
      const vx = typeof x[k] === 'number' ? x[k] : (x[k] ? 10 : 0), vy = typeof y[k] === 'number' ? y[k] : (y[k] ? 10 : 0);
      m[k] = vx >= vy ? x[k] : y[k];
    }
    if (x.prat || y.prat) { m.prat = {}; for (const k of ['mc', 'fill', 'order']) { const v = Math.max((x.prat || {})[k] ?? -1, (y.prat || {})[k] ?? -1); if (v >= 0) m.prat[k] = v; } }
    out.p[id] = m;
  }
  for (const k of new Set([...Object.keys(a.known), ...Object.keys(b.known)])) out.known[k] = Math.max(a.known[k] || 0, b.known[k] || 0);
  for (const k of new Set([...Object.keys(a.days), ...Object.keys(b.days)])) out.days[k] = Math.max(a.days[k] || 0, b.days[k] || 0);
  out.stops = Object.assign({}, a.stops, b.stops);
  for (const k of new Set([...Object.keys(a.srs), ...Object.keys(b.srs)])) { const x = a.srs[k], y = b.srs[k]; out.srs[k] = !x ? y : !y ? x : (x.d > y.d || (x.d === y.d && x.b >= y.b) ? x : y); }
  const seen = new Set(); out.grades = [...a.grades, ...b.grades].filter(g => { const k = g.id + g.at; if (seen.has(k)) return false; seen.add(k); return true; }).sort((p, q) => p.at < q.at ? -1 : 1);
  return out;
}
function setSync(t) { document.getElementById('syncnote').textContent = t; }

/* ---------- Áudio: voz do Claude, ou voz polonesa do aparelho ---------- */
const audio = {
  tts: null, voice: null, rate: 0.9,
  async init() {
    try { this.rate = +(localStorage.getItem('polski-rate') || 0.9); } catch (e) {}
    try {
      if (window.speechSynthesis) {
        const pick = () => { const vs = speechSynthesis.getVoices(); this.voice = vs.find(v => /^pl(-|_|$)/i.test(v.lang) && /google|natural|online/i.test(v.name)) || vs.find(v => /^pl/i.test(v.lang)) || null; this.update(); };
        pick(); speechSynthesis.onvoiceschanged = pick; setTimeout(pick, 1200);
      }
    } catch (e) {}
    try { if (window.claude?.use) { this.tts = await claude.use('tts'); this.update(); } } catch (e) {}
    this.update();
  },
  can() { return !!(this.tts || this.voice); },
  mode() { return this.tts ? 'claude' : this.voice ? 'device' : 'none'; },
  update() {
    document.body.classList.toggle('no-audio', !this.can());
    const c = document.getElementById('audiochip'); if (!c) return;
    const m = this.mode();
    c.className = 'audiochip ' + (m === 'none' ? 'off' : 'on');
    c.innerHTML = `<i></i>${m === 'claude' ? 'Voz do Claude' : m === 'device' ? 'Voz do aparelho' : 'Ativar áudio'}`;
  },
  async say(text, onEnd) {
    text = speakable(text); if (!text) { onEnd && onEnd(); return; }
    store.log(1);
    if (this.tts) {
      try { await this.tts.speak(text, { language: 'pl', rate: this.rate }); onEnd && onEnd(); return; }
      catch (e) {
        if (e && (e.code === 'not_granted')) { this.tts = null; this.update(); }
        if (e && e.code === 'viewer_stopped') { return; }
        if (!this.voice) { onEnd && onEnd(); if (e && e.code === 'rate_limited') toast('Muitos áudios seguidos. Espere um pouco.'); return; }
      }
    }
    if (this.voice) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text); u.voice = this.voice; u.lang = this.voice.lang; u.rate = this.rate;
        u.onend = () => onEnd && onEnd(); u.onerror = () => onEnd && onEnd(); speechSynthesis.speak(u);
      } catch (e) { onEnd && onEnd(); }
    } else { toast('Sem voz polonesa nesta tela. Veja "Como ativar o áudio".'); onEnd && onEnd(); }
  },
  stop() { try { this.tts && this.tts.stop(); } catch (e) {} try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} },
};
function audioHelpHTML() {
  return `<div class="audiohelp" id="audiohelp"><h4>Como ativar o áudio</h4>
  <p>${audio.mode() === 'claude' ? 'Você está ouvindo a voz do Claude, que só funciona no navegador.' : audio.mode() === 'device' ? 'Você está ouvindo a voz polonesa do seu aparelho.' : 'Esta tela não tem nenhuma voz polonesa disponível.'} O app tenta, nesta ordem: a voz do Claude (navegador no computador), e depois a voz polonesa do aparelho.</p>
  <ol>

}

const level = id => COURSE.levels[id] || [];

const allWords = ch => ch.vocab.flatMap(g => g.w.map(w => ({ pl: w[0], pt: w[1], note: w[2] || '' })));
const bankGroups = lvl => COURSE.banks[lvl] || [];
const bankWords = lvl => bankGroups(lvl).flatMap(g => g.w.map(w => ({ pl: w[0], pt: w[1], g: w[2] || '', note: w[3] || '' })));
const wkey = (lvl, pl) => lvl + '|' + pl.toLowerCase();
const levelVocab = lvl => { const m = new Map(); for (const c of level(lvl)) for (const w of allWords(c)) m.set(wkey(lvl, w.pl), w); for (const w of bankWords(lvl)) m.set(wkey(lvl, w.pl), w); return m; };
const mastered = key => store.box(key) >= 2;
const stepDone = (p, s) => s === 'pratica' ? (p.pratica || 0) >= 70 : s === 'redacao' ? (p.redacao === true || (typeof p.redacao === 'number' && p.redacao >= 5)) : !!p[s];
const chDone = id => STEPS.every(s => stepDone(store.get(id), s.id));
const countDone = id => STEPS.filter(s => stepDone(store.get(id), s.id)).length;
const stopsOf = lvl => COURSE.stopsBy[lvl] || [];
const stopAfter = (lvl, n) => stopsOf(lvl).find(s => s.after === n);

function parseHash() {
  const h = location.hash.replace('#', '');
  let m = h.match(/^(a1|a2|b1|b2)-(\d+)(?:-(vocab|gramatica|dialogo|pratica|redacao|licao))?$/);
  if (m && findCh(m[1], +m[2])) return { name: 'ch', lvl: m[1], n: +m[2], tab: m[3] || 'vocab' };
  m = h.match(/^(a1|a2|b1|b2)-parada-(\d+)$/);
  if (m && stopAfter(m[1], +m[2])) return { name: 'stop', lvl: m[1], n: +m[2] };
  m = h.match(/^vocabulario(?:-(a1|a2|b1|b2))?$/);
  if (m) return { name: 'bank', lvl: m[1] || ui.lvl };
  if (h === 'progresso') return { name: 'stats', lvl: ui.lvl };
  if (h === 'revisao') return { name: 'review', lvl: ui.lvl };
  m = h.match(/^nivel-(a1|a2|b1|b2)$/);
  if (m) return { name: 'home', lvl: m[1] };
  return { name: 'home', lvl: ui.lvl };
}
function go(hash) { if (location.hash === '#' + hash) route(); else location.hash = hash; }
function route() {
  const prev = view; view = parseHash();
  ui.lvl = view.lvl;
  if (view.name === 'ch' && (prev.name !== 'ch' || prev.n !== view.n || prev.lvl !== view.lvl)) { ui.flash = null; ui.learn = null; ui.gc = null; ui.rp = null; ui.ps = null; ui.result = null; }
  if (view.name === 'ch' && prev.name === 'ch' && prev.tab !== view.tab) { ui.flash = null; }
  if (view.name !== prev.name) ui.flash = null;
  if (!(view.name === 'ch' && view.tab === 'licao') && view.name !== 'review') ui.ls = null;
  if (view.name === 'review' && prev.name !== 'review') ui.ls = null;
  audio.stop();
  render();
  if (prev.name !== view.name || prev.n !== view.n || prev.lvl !== view.lvl) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function renderChapter() {
  const ch = findCh(view.lvl, view.n), id = chId(view.lvl, view.n), p = store.get(id);

/* ---------- Exemplos ---------- */
const exOf = (lvl, n, key) => ((COURSE.extras[lvl + '-' + n] || {}).ex || {})[key] || null;
const checksOf = (lvl, n) => (COURSE.extras[lvl + '-' + n] || {}).checks || [];
const markHTML = s => esc(s).replace(/\*([^*]+)\*/g, '<mark>$1</mark>');
const plainEx = s => String(s).replace(/\*/g, '');
const clozeOf = s => { const m = String(s).match(/^(.*?)\*([^*]+)\*(.*)$/); return m ? { a: m[1].replace(/\*/g, ''), ans: m[2], b: m[3].replace(/\*/g, '') } : null; };
const firstForm = pl => speakable(pl.split(' / ')[0]).replace(/[?!.]$/, '');
const chWords = (lvl, ch) => allWords(ch).map(w => Object.assign({}, w, { ex: exOf(lvl, ch.n, w.pl) }));
const batchesOf = (lvl, ch) => { const ws = chWords(lvl, ch), out = []; for (let i = 0; i < ws.length; i += 5) out.push(ws.slice(i, i + 5)); if (out.length > 1 && out[out.length - 1].length < 3) { const last = out.pop(); out[out.length - 1].push(...last); } return out; };
const norm = s => s.toLowerCase().replace(/[.,!?„”"«»:;—–-]/g, ' ').replace(/\s+/g, ' ').trim();
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/Ł/g, 'L');
function judge(v, answers) {
  const n = norm(v || ''); if (!n) return 'wrong';
  for (const a of answers) if (n === norm(a)) return 'right';
  for (const a of answers) if (strip(n) === strip(norm(a))) return 'close';
  return 'wrong';
}
const keysHTML = () => `<div class="keys" aria-label="Letras polonesas">${LETTERS.map(l => `<button type="button" data-act="key" data-k="${l}">${l}</button>`).join('')}</div>`;

function makeMatch(words) {
  return { left: shuffle(words.map((w, i) => ({ i, t: firstForm(w.pl), full: w.pl }))), right: shuffle(words.map((w, i) => ({ i, t: w.pt }))), sel: null, doneL: [], doneR: [], miss: 0, bad: null };

    <div class="mcol">${m.right.map(x => `<button type="button" data-act="${act}" data-side="r" data-i="${x.i}" class="${m.doneR.includes(x.i) ? 'ok' : ''} ${m.bad && m.bad.r === x.i ? 'bad' : ''}" ${m.doneR.includes(x.i) ? 'disabled' : ''}>${esc(x.t)}</button>`).join('')}</div>

/* Retorna true quando todos os pares foram ligados */
function matchTap(m, side, i, words) {

  if (m.sel === null) { toast('Toque primeiro numa palavra em polonês.'); return false; }

function rpAdvance(ch) {

function makeSession(ch) {

async function doCorrect(ch, id) {
  if (correcting) return;
  const ta = document.getElementById('essay'); const text = ta.value.trim();
  const n = (text.match(/[\p{L}\p{N}]+/gu) || []).length;
  if (n < Math.min(8, ch.write.min)) { toast('Escreva um pouco mais antes de corrigir.'); return; }
  const sample = await getSample(); if (!sample) return;
  correcting = true;
  const btn = document.getElementById('correctBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Corrigindo…';
  const out = document.getElementById('result'); out.innerHTML = '';
  try {
    const prompt = correctionPrompt(ch, text);
    let r;
    try { r = typeof sample.json === 'function' ? await sample.json(prompt, { modelTier: 'default' }) : null; } catch (e) { if (e && (e.code === 'not_granted' || e.code === 'rate_limited')) throw e; r = null; }
    if (!r) { const res = await sample(prompt, { modelTier: 'default' }); r = parseJSON(res.text); }
    if (typeof r === 'string') r = parseJSON(r);
    const e = await store.loadEssay(id);
    const at = new Date().toISOString();
    e.attempts.push({ text, result: r, at });
    if (e.attempts.length > 8) e.attempts = e.attempts.slice(-8);
    e.draft = text;
    store.saveEssay(id, true);
    ui.result = e.attempts[e.attempts.length - 1];
    const nota = Number(r.nota); const p = store.get(id);
    p.redacao = Math.max(typeof p.redacao === 'number' ? p.redacao : 0, isNaN(nota) ? 0 : nota);
    if (!isNaN(nota)) { store.data.grades.push({ id, n: nota, at, w: n }); if (store.data.grades.length > 200) store.data.grades = store.data.grades.slice(-200); }
    store.data.last = id; store.log(2); store.save(true);
    writingRender(ch, id);
    setTimeout(() => document.getElementById('result')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  } catch (e) {
    out.innerHTML = `<div class="notice">${e && e.code === 'rate_limited' ? 'Muitas correções seguidas. Espere um minuto e tente de novo.' : e && e.code === 'not_granted' ? 'A correção por IA foi recusada nesta tela. Use "Copiar pedido de correção".' : 'Não consegui ler a correção desta vez. Tente de novo.'}</div>`;
    btn.disabled = false; btn.textContent = 'Corrigir com IA';
  } finally { correcting = false; }
}

  let body = '', cont = false;
  if (t.k === 'intro') { cont = true; body = `<div class="lsword" lang="pl">${esc(t.w.pl)}</div><div class="bar-actions" style="justify-content:center">${sayBtn(firstForm(t.w.pl), 'a palavra')}<button class="btn ghost sm" type="button" data-act="slow" data-t="${esc(firstForm(t.w.pl))}">devagar</button></div>
      <div class="lstr">${esc(t.w.pt)}</div>${t.w.note ? `<div class="meta">${esc(t.w.note)}</div>` : ''}${exampleBlock(t.w.ex)}
      <div class="bar-actions" style="justify-content:center;margin-top:12px">${micBtn('say:' + firstForm(t.w.pl), 'Repetir em voz alta') || '<p class="meta">Ouça e repita em voz alta.</p>'}</div><div id="micres"></div>`; }
  else if (t.k === 'tip') { cont = true; body = `<div class="gram lstip"><h4>${esc(t.g.t)}</h4>${t.g.h.replace(/<table>/g, '<div class="tblwrap"><table>').replace(/<\/table>/g, '</table></div>')}</div>`; }
  else if (t.k === 'mean') body = `<div class="lsword sm" lang="pl">${esc(t.w.pl)} ${sayBtn(firstForm(t.w.pl), '', true)}</div>${choice(t.opts, t.ans)}`;
  else if (t.k === 'say') body = `<div class="lsword sm">${esc(t.w.pt)}</div>${choice(t.opts, t.ans, true)}`;
  else if (t.k === 'listen') body = `<div class="bar-actions" style="justify-content:center"><button class="btn sm" type="button" data-say="${esc(t.ans)}">▶ Ouvir</button><button class="btn ghost sm" type="button" data-act="slow" data-t="${esc(t.ans)}">devagar</button></div>${choice(t.opts, t.ans, true)}`;
  else if (t.k === 'match') body = matchHTML(t.m, 'lsmatch');
  else if (t.k === 'cloze') body = `<div class="clz" lang="pl">${esc(t.a)}<span class="blank">${st ? esc(st.pick) : '____'}</span>${esc(t.b)}</div><div class="hint">${esc(t.pt)}</div>${choice(t.opts, t.ans, true)}`;
  else if (t.k === 'gcheck') { const c = t.c; body = `<div class="clz">${esc(c[0]).replace('___', `<span class="blank">${st ? esc(st.pick) : '____'}</span>`)}</div>${choice(c[1], c[1][c[2]], true)}`; }
  else if (t.k === 'dlg') body = `<div class="lsdlg"><div class="who">${esc(t.prev[0])}</div><div lang="pl">${esc(t.prev[1])} ${sayBtn(t.prev[1], 'a fala', true)}</div><div class="hint">${esc(t.prev[2])}</div></div>
      <p class="meta">${esc(t.line[0])} responde: <em>${esc(t.line[2])}</em></p>${choice(t.opts, t.ans, true)}`;
  else if (t.k === 'order') body = `<div class="hint" style="margin:0 0 6px">${esc(t.pt)}</div>
      <div class="tokens built">${t.built.map((x, j) => `<button type="button" data-act="lsunpick" data-j="${j}" ${st ? 'disabled' : ''} lang="pl">${esc(x.t)}</button>`).join('')}</div>
      <div class="tokens">${t.pool.map((x, j) => `<button type="button" data-act="lstok" data-j="${j}" ${st ? 'disabled' : ''} lang="pl">${esc(x.t)}</button>`).join('')}</div>
      ${!t.pool.length && !st ? `<button class="btn sm" type="button" data-act="lscheck">Verificar</button>` : ''}`;
  else if (t.k === 'type') body = `<div class="lsword sm">${esc(t.w.pt)}</div>${t.w.ex ? `<div class="hint">Exemplo: ${esc(t.w.ex[1])}</div>` : ''}${keysHTML()}
      <div class="bar-actions"><input class="pinput ${st ? st.res : ''}" id="linput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" lang="pl" value="${st ? esc(st.v) : ''}" ${st ? 'disabled' : ''} aria-label="Sua resposta">${st ? '' : micBtn('linput') + '<button class="btn sm" type="button" data-act="lscheck">Verificar</button>'}</div>`;
  const again = R.again.has(R.i) ? '<span class="lsagain">de novo</span>' : '';
  return `${bar}<div class="lscard"><div class="prompt">${LS_LABEL[t.k]} ${again}</div>${body}</div>
    ${cont ? `<div class="lsfoot"><button class="btn accent" type="button" data-act="lsnext" id="lsnext">Continuar →</button></div>` : st ? lsFeedback(t, st) : ''}`;
}
function lsAnswer(t) { return t.k === 'gcheck' ? t.c[1][t.c[2]] : t.k === 'type' ? t.ans[0] : t.k === 'order' ? t.text : t.ans; }
function lsFeedback(t, st) {
  const ok = st.res !== 'wrong', ans = lsAnswer(t);
  const full = t.k === 'cloze' ? t.a + t.ans + t.b : t.k === 'gcheck' && /___/.test(t.c[0]) && !/:/.test(t.c[0]) ? t.c[0].replace('___', ans).replace(/\(.*?\)/g, '') : t.k === 'match' ? '' : ans;
  const msg = t.k === 'match' ? (st.miss ? `Feito, com ${st.miss} erro(s).` : 'Perfeito!') : st.res === 'right' ? 'Certo!' : st.res === 'close' ? `Quase: confira os acentos. <b>${esc(ans)}</b>` : `Resposta: <b>${esc(ans)}</b>`;
  const expl = t.k === 'gcheck' ? `<div class="meta">${esc(t.c[3])}</div>` : '';
  const ex = !ok && t.w && t.w.ex && t.k !== 'cloze' ? `<div class="example small"><div class="exl" lang="pl">${markHTML(t.w.ex[0])}</div><div class="ext">${esc(t.w.ex[1])}</div></div>` : '';
  return `<div class="lsfoot ${ok ? 'ok' : 'bad'}"><div class="lsmsg">${msg} ${full ? sayBtn(full, 'a resposta', true) : ''}${expl}${ex}${!ok && t.k !== 'match' ? '<div class="meta">Esta volta no fim.</div>' : ''}</div>
    <button class="btn ${ok ? 'accent' : ''}" type="button" data-act="lsnext" id="lsnext">Continuar →</button></div>`;
}
function lsEndHTML(R) {
  const pct = R.graded ? Math.round(R.right / R.graded * 100) : 100;
  if (R.mode === 'rev') {
    const left = srsDueKeys().length, tom = srsCountOn(dayPlus(1));
    return `<div class="wcard"><div class="face">${pct}%</div><p class="meta">Revisão feita: ${R.total} palavras, ${R.right} de ${R.graded} respostas certas de primeira.</p>
      <p class="meta">${left ? `Ainda há ${left} para hoje.` : 'Nada mais para hoje.'} Amanhã: ${tom} palavra(s).</p>
      <div class="bar-actions" style="justify-content:center">${left ? '<button class="btn accent" type="button" data-act="rvstart">Mais uma rodada</button>' : ''}<a class="btn ghost sm" href="#nivel-${ui.lvl}">Voltar ao curso</a></div></div>`;
  }
  const ch = findCh(R.lvl, R.n), nb = batchesOf(R.lvl, ch).length;
  return `<div class="wcard"><div class="face">Lição ${R.b + 1} concluída</div><p class="meta">${pct}% de acerto de primeira. As palavras desta lição entraram na sua revisão diária.</p>
    <div class="bar-actions" style="justify-content:center">${R.b < nb - 1 ? `<button class="btn accent" type="button" data-act="lsgo" data-b="${R.b + 1}">Próxima lição →</button>` : `<a class="btn accent" href="#${R.lvl}-${R.n}-gramatica">Ir para a gramática completa →</a>`}
    <a class="btn ghost sm" href="#${R.lvl}-${R.n}">Voltar ao capítulo</a></div></div>`;
}
function lsRecord(R, t, res, extra) {
  R.st = Object.assign({ res }, extra || {});
  const ok = res !== 'wrong';
  const first = !R.seen.has(t); R.seen.add(t);
  if (first) { R.graded++; if (ok) R.right++; }
  const k = lsKey(R, t);
  if (k && first) {
    if (R.mode === 'rev') srsGrade(k, ok);
    else { store.setBox(k, ok ? store.box(k) + 1 : Math.min(store.box(k), 1)); srsSeed(k); }
  }
  if (!ok && t.k !== 'match' && !t.requeued) { const c = Object.assign({}, t, { requeued: true }); if (c.k === 'order') { c.pool = shuffle(t.text.split(' ')).map((x, i) => ({ t: x, i })); c.built = []; } if (c.opts) c.opts = shuffle(c.opts); R.items.push(c); R.again.add(R.items.length - 1); R.seen.add(c); }
  if (ok && audio.can() && t.k !== 'match') { const ans = lsAnswer(t); audio.say(t.k === 'cloze' ? t.a + t.ans + t.b : ans); }
  store.log(); store.save();
}
function lsFinish(R) {
  if (R.mode !== 'les') return;
  const ch = findCh(R.lvl, R.n), id = chId(R.lvl, R.n), p = store.get(id), nb = batchesOf(R.lvl, ch).length;
  for (const w of batchesOf(R.lvl, ch)[R.b]) srsSeed(wkey(R.lvl, w.pl));
  p.vb = Math.max(p.vb || 0, R.b + 1);
  if (p.vb >= nb && !p.vocab) { p.vocab = true; toast('Etapa Palavras concluída'); }
  store.data.last = id; store.log(3); store.save();
}
function lessonsCard(ch, id) {
  const nb = batchesOf(view.lvl, ch).length, vb = Math.min(store.get(id).vb || 0, nb);
  return `<section class="lessons"><div><div class="eyebrow">Lição guiada · passo a passo</div>
    <h3>${vb >= nb ? 'Todas as lições feitas' : vb ? `Lição ${vb + 1} de ${nb}` : `${nb} lições curtas`}</h3>
    <p class="meta">Uma tela por vez: palavra nova, teste, pares, áudio, exemplo, dica de gramática e um trecho do diálogo. Uns 5 minutos cada.</p></div>
    <div class="lchips">${Array.from({ length: nb }, (_, i) => `<button type="button" data-act="lsgo" data-b="${i}" class="${i < vb ? 'done' : i === vb ? 'next' : ''}" aria-label="Lição ${i + 1}">${i < vb ? '✓' : i + 1}</button>`).join('')}</div>
    <button class="btn accent" type="button" data-act="lsgo" data-b="${vb >= nb ? 0 : vb}">${vb >= nb ? 'Refazer a lição 1' : vb ? 'Continuar' : 'Começar a lição 1'} →</button></section>`;
}
function reviewBanner() {
  srsSync();
  const n = srsDueKeys().length;
  if (!n) return '';
  return `<a class="revbanner" href="#revisao"><span class="eyebrow">Revisão de hoje</span><b>${n} palavra${n > 1 ? 's' : ''} para revisar</b><span class="meta">${Math.max(1, Math.round(Math.min(n, 20) * 0.25))} min · revisar agora →</span></a>`;
}
function renderLesson() {
  const ch = findCh(view.lvl, view.n);
  if (!ui.ls || ui.ls.mode !== 'les' || ui.ls.n !== ch.n || ui.ls.lvl !== view.lvl) { const nb = batchesOf(view.lvl, ch).length; ui.ls = buildLesson(view.lvl, ch, Math.min(store.get(chId(view.lvl, ch.n)).vb || 0, nb - 1)); }
  app.innerHTML = `<div class="lsmain"><div class="eyebrow lsctx">${view.lvl.toUpperCase()} · Cap. ${ch.n} · ${esc(ch.pl)} · Lição ${ui.ls.b + 1}</div>${runnerHTML(ui.ls)}</div>`;
  lsAuto();
}
function renderReview() {
  srsSync();
  const n = srsDueKeys().length, total = Object.keys(srs()).length;
  if (!ui.ls || ui.ls.mode !== 'rev') {
    const next = [1, 2, 3, 7].map(d => [d, srsCountOn(dayPlus(d))]);
    app.innerHTML = `<section class="hero"><div><div class="eyebrow">Revisão espaçada</div><h1>${n ? `<em>${n}</em> palavra${n > 1 ? 's' : ''} para hoje` : 'Tudo em <em>dia</em>'}</h1>
      <p>${total ? `Cada palavra que você aprende volta para revisão no momento certo: logo no dia seguinte, depois em 2, 4, 7, 15, 30 e 60 dias. Se errar, ela volta a aparecer amanhã.` : 'Ainda não há palavras na revisão. Faça uma lição guiada ou um bloco de palavras e elas aparecem aqui a partir de amanhã.'}</p>
      ${n ? `<button class="btn accent" type="button" data-act="rvstart">Começar a revisão${n > 20 ? ' (20 por rodada)' : ''} →</button>` : `<a class="btn accent" href="#nivel-${ui.lvl}">Ir para o curso →</a>`}</div></section>
      ${total ? `<div class="tiles"><div class="tile"><b>${total}</b><span>palavras na revisão</span></div>${next.map(([d, c]) => `<div class="tile"><b>${c}</b><span>${d === 1 ? 'amanhã' : `em ${d} dias`}</span></div>`).join('')}</div>` : ''}`;
    return;
  }
  app.innerHTML = `<div class="lsmain"><div class="eyebrow lsctx">Revisão de hoje</div>${runnerHTML(ui.ls)}</div>`;
  lsAuto();
}
function lsAuto() {
  const R = ui.ls, t = R && R.items[R.i]; if (!t || R.st) return;
  if (t.k === 'listen') setTimeout(() => audio.say(t.ans), 250);
  if (t.k === 'intro' && audio.can()) setTimeout(() => audio.say(firstForm(t.w.pl)), 250);
  if (t.k === 'type') setTimeout(() => document.getElementById('linput')?.focus(), 60);
}
function lsRerender() { render(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, R = ui.ls;
  if (a === 'lsgo') { const ch = findCh(view.lvl, view.n); ui.ls = buildLesson(view.lvl, ch, +b.dataset.b); go(`${view.lvl}-${view.n}-licao`); window.scrollTo(0, 0); return; }
  if (a === 'rvstart') { ui.ls = buildReview(); if (!ui.ls.items.length) { ui.ls = null; toast('Nada para revisar agora.'); } render(); window.scrollTo(0, 0); return; }
  if (a === 'lsquit') { ui.ls = null; return; }
  if (!R || !a.startsWith('ls')) return;
  const t = R.items[R.i];
  if (a === 'lspick' && !R.st) { const opts = t.k === 'gcheck' ? t.c[1] : t.opts, pick = opts[+b.dataset.o]; lsRecord(R, t, pick === lsAnswer(t) ? 'right' : 'wrong', { pick }); }
  else if (a === 'lsmatch' && !R.st) { if (matchTap(t.m, b.dataset.side, +b.dataset.i, t.words)) { R.st = { res: t.m.miss <= 1 ? 'right' : 'wrong', miss: t.m.miss }; R.graded++; if (t.m.miss <= 1) R.right++; for (const w of t.words) srsSeed(wkey(R.lvl, w.pl)); } }
  else if (a === 'lstok') t.built.push(t.pool.splice(+b.dataset.j, 1)[0]);
  else if (a === 'lsunpick') t.pool.push(t.built.splice(+b.dataset.j, 1)[0]);
  else if (a === 'lscheck' && !R.st) {
    if (t.k === 'order') lsRecord(R, t, norm(t.built.map(x => x.t).join(' ')) === norm(t.text) ? 'right' : 'wrong');
    else { const v = (document.getElementById('linput') || {}).value || ''; if (!v.trim()) { toast('Escreva sua resposta.'); return; } lsRecord(R, t, judge(v, t.ans), { v }); }
  }
  else if (a === 'lsnext') { R.i++; R.st = null; if (R.i >= R.items.length) lsFinish(R); }
  else return;
  lsRerender();
  if (a === 'lsnext') window.scrollTo(0, 0); else document.querySelector('.lsfoot')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !ui.ls) return;
  if (e.target.id === 'linput') { e.preventDefault(); document.querySelector('[data-act="lscheck"]')?.click(); }
  else if (document.getElementById('lsnext') && !e.target.matches('textarea, input')) { e.preventDefault(); document.getElementById('lsnext').click(); }
});

/* ---------- Início ---------- */
store.init();
route();
audio.init();
setSync('Progresso salvo neste navegador.');
})();
</script>
